name: reels-bot

on:
  schedule:
    - cron: "0 */4 * * *"     # coleta de snapshots a cada 4 h (UTC)
    - cron: "31 17 * * *"     # produção 1x por dia: 14:31 em Brasília (vídeo pronto para postar às 15h)
  workflow_dispatch:
    inputs:
      mode:
        description: "collect | run | dry-run | sim"
        default: "dry-run"

permissions:
  contents: write            # commit do estado + releases para hospedar o MP4

concurrency:
  group: reels-bot
  cancel-in-progress: false  # nunca interromper uma publicação no meio (anti-duplicata)

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}   # variável do repositório: "true" só depois da sua autorização
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core espeak-ng libsndfile1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Cache do modelo de voz (Kokoro)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-v1
      - name: Decidir modo
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "0 */4 * * *" ]; then echo "mode=collect" >> $GITHUB_OUTPUT;
          else echo "mode=run" >> $GITHUB_OUTPUT; fi
      - name: Executar
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            collect) python -m bot.main collect ;;
            run)     python -m bot.main run ;;
            sim)     python -m bot.main run --dry-run --sim ;;
            *)       python -m bot.main run --dry-run ;;
          esac
      - name: Salvar estado (SQLite) no repositório
        run: |
          git config user.name "reels-bot" && git config user.email "bot@users.noreply.github.com"
          git add state/bot.sqlite && git commit -m "state: $(date -u +%FT%TZ) [skip ci]" || true
          git push
      - name: Guardar saída (vídeo + relatório) por 14 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-output-${{ github.run_id }}
          path: |
            output/**/reel_*.mp4
            output/*.md
            output/**/pauta.json
          retention-days: 14
          if-no-files-found: ignore
